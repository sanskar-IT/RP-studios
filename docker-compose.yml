services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: narrative
      POSTGRES_USER: narrative
      POSTGRES_PASSWORD: narrative
    ports:
      - "5432:5432"
    volumes:
      - narrative-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrative -d narrative"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NARRATIVE_DATABASE_URL: postgresql+psycopg://narrative:narrative@postgres:5432/narrative
      NARRATIVE_CORS_ORIGINS: ${NARRATIVE_CORS_ORIGINS:-http://localhost:5173}
      NARRATIVE_PROVIDER: ${NARRATIVE_PROVIDER:-heuristic}
      NARRATIVE_PROVIDER_BASE_URL: ${NARRATIVE_PROVIDER_BASE_URL:-}
      NARRATIVE_PROVIDER_API_KEY: ${NARRATIVE_PROVIDER_API_KEY:-}
      NARRATIVE_PROVIDER_MODEL: ${NARRATIVE_PROVIDER_MODEL:-}
      NARRATIVE_AUTO_CREATE_SCHEMA: ${NARRATIVE_AUTO_CREATE_SCHEMA:-false}
    command: sh -c "alembic upgrade head && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  narrative-postgres:
